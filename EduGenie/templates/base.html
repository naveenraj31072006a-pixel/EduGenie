<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        EduGenie
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <a
        class="brand"
        href="{{ url_for('index') }}"
    >
        EduGenie
    </a>


    <div class="nav-links">

        {% if session.get('user_id') %}

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('quiz') }}">
                Quiz
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a
                class="nav-button"
                href="{{ url_for('register') }}"
            >
                Get Started
            </a>

        {% endif %}

    </div>

</nav>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<footer>

    <p>
        EduGenie • AI Personalized Learning Platform
    </p>

</footer>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


{% block scripts %}

{% endblock %}


</body>

</html>
